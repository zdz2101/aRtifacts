url: https://zdz2101.github.io/aRtifacts

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    preset: "flatly"
    
home:
  title: aRtifacts
  description: Schema-agnostic dataset observability engine with bundled SDTM/ADaM modules.

navbar:
  structure:
    left: [intro, reference, articles]

